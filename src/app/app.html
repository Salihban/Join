@if (router.url === '/' || router.url.startsWith('/log-in') || router.url.startsWith('/sign-up')) {
<router-outlet></router-outlet>
} @else {
<div class="app-layout">
    <app-aside></app-aside>

        <div class="page">
        <app-header></app-header>

        <main>
            <router-outlet></router-outlet>
        </main>

    @if (contactService.toastMessage()) {
        <div class="toast-notification">
            {{ contactService.toastMessage() }}
        </div>
    }
    </div>
</div>
}
